#
#	LampControl Config File
#	=====================================
#
#	Plugin by Ceph adapted from jacklink01
#
#	Need a new config file? Just delete this one and a new one will be created.
#

# The item with which players can turn lamps, rails and shelves on/off.
# Use a Bukkit material name. (default: FLINT_AND_STEEL)
lampControlItem: FLINT_AND_STEEL

# If set to true, then LampControl will check if players have permission, otherwise it will let everyone control lamps.
usePermissions: true

# When this is set to true, OP'd players can use their hand to control the lamps in addition to the item above.
# You may also give a player or group the 'lampcontrol.hand' permission.
opUsesHand: true

# Toggle the lamps on/off with your item/hand! If off, lamps will turn ON, but not off.
toggleLamps: true

# Toggle the rails on/off with your item/hand! If off, rails will turn ON, but not off.
controlRails: true

# Toggle shelves (étagères) to their "powered" look with the item, like lamps.
# Powered shelves connect with neighbours facing the same way (max 3) and swap the hotbar like vanilla.
controlShelves: true

# Shelves can also be toggled with an empty hand (standing). Sneak + empty hand keeps the vanilla
# behaviour, to take items back from the shelf. Only needs 'lampcontrol.shelf'.
shelfEmptyHand: true

# Take the item from the player after they use it to turn on a lamp
takeItemOnUse: false

# Don't edit this or I, your God, will reset this config.
config-version: 7

# Permissions:
# lampcontrol.use -> Basic permission for using this plugin
# lampcontrol.hand -> Needed for ON/OFF lamps with hand
# lampcontrol.shelf -> Needed for ON/OFF shelves
# lampcontrol.worldedit -> Allows using WorldEdit to turn on/off lamps and shelves
