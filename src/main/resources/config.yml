#
#	LampControl Config File
#	=====================================
#
#	Plugin by Ceph adapted from jacklink01
#
#	Need a new config file? Just delete this one and a new one will be created.
#
#	Lamps, powered rails and shelves are switched with a right-click, empty hand.
#	Sneak + right-click keeps the vanilla behaviour (e.g. to take items back from a shelf).
#

# If set to true, players need 'lampcontrol.use' (given to everyone by default).
usePermissions: true

# Toggle the lamps on/off with your hand! If off, lamps will turn ON, but not off.
toggleLamps: true

# Switch powered rails on/off with your hand.
controlRails: true

# Switch shelves (étagères) to their "powered" look with your hand, like lamps.
# Powered shelves connect with neighbours facing the same way (max 3) and swap the hotbar like vanilla.
controlShelves: true

# Don't edit this or I, your God, will reset this config.
config-version: 8

# Permissions:
# lampcontrol.use -> Switch lamps, rails and shelves by hand (everyone by default)
# lampcontrol.worldedit -> Allows using WorldEdit to turn on/off lamps and shelves (op by default)
