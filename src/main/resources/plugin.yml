name: LampControl
author: Ceph
version: ${spigot.plugin.version}
main: cz.ceph.LampControl.LampControl
api-version: '26.3'
softdepend: [WorldEdit, FastAsyncWorldEdit]

commands:
   lamp:
      description: Turn on/off lamps and shelves in your WorldEdit selection
      usage: /<command> [off]
      aliases: [lc, lampcontrol]
   /lamp:
      description: Turn on/off lamps and shelves in your WorldEdit selection
      usage: /<command> [off]
      aliases: [/lc, /lampcontrol]

permissions:
   lampcontrol.use:
      description: Switch lamps, rails and shelves with an empty hand
      default: true
   lampcontrol.worldedit:
      description: Use /lamp and //lamp with a WorldEdit selection
      default: op
